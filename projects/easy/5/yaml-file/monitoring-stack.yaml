apiVersion: v1
kind: Namespace
metadata:
  name: monitoring

---
# ==========================================
# PROMETHEUS DEPLOYMENT & SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  namespace: monitoring                     # Drops it inside the monitoring box
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-server-conf    # Pulls your ConfigMap data
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          ports:
            - containerPort: 9090          # Prometheus natively listens on 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus/
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus                         # Points exactly to the Prometheus pod
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090                      # Targets internal Prometheus port
      nodePort: 30090                       # Exposes it to the outside world

---
# ==========================================
# GRAFANA DEPLOYMENT & SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
  namespace: monitoring                     # Drops it inside the monitoring box
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000          # Grafana natively listens on 3000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: grafana                            # Points exactly to the Grafana pod
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000                      # Targets internal Grafana port
      nodePort: 30030                       # Exposes it to the outside world
