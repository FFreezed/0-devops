apiVersion: apps/v1
kind: Deployment 
metadata:
  name: metrics-app 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-app-1
  template:
    metadata:
      labels:
        app: metrics-app-1
    spec:
      containers:
        - name: nginx-container
          image: nginx/nginx-prometheus-exporter:1.1.0
          ports:
            - containerPort: 9113

---
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  type: NodePort
  selector:
    app: metrics-app-1
  ports:
    - protocol: TCP
      port: 9113 
      targetPort: 9113 
      nodePort: 30080

